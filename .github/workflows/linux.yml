# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Every stage of tests/run but proof, on Linux, after every push to main. Proof results do
# not depend on the OS, and proofs already run locally before every push (docs/STYLE.md).

name: Linux

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Alire and the GNAT toolchain
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2  # v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1
          cache: true

      - name: Cache Alire dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/alire/releases
          key: alire-releases-${{ runner.os }}-${{ hashFiles('alire.toml', 'cli/alire.toml', 'tests/unit/alire.toml') }}

      - name: Build PUC Lua 5.4.9 (the reference)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lua-5.4.9.tar.gz" https://www.lua.org/ftp/lua-5.4.9.tar.gz
          echo "2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6  $RUNNER_TEMP/lua-5.4.9.tar.gz" \
            | sha256sum -c -
          mkdir "$RUNNER_TEMP/lua"
          tar -xzf "$RUNNER_TEMP/lua-5.4.9.tar.gz" -C "$RUNNER_TEMP/lua" --strip-components=1
          make -C "$RUNNER_TEMP/lua" linux
          echo "PYRO_REF_LUA=$RUNNER_TEMP/lua/src" >> "$GITHUB_ENV"

      - name: Fetch the official Lua 5.4.9 tests
        run: tools/fetch-lua-tests

      - name: Fetch Unicode's grapheme break test (and regenerate the tables, unchanged)
        run: |
          tools/generate-grapheme-tables
          git diff --exit-code src/common/pyro-grapheme_tables.ads

      - name: Run tests/run without the proof stage
        run: tests/run --skip-proof

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: run-log
          path: tests/output/run.log

name = "pyro_lua_unit"
description = "Unit tests for what the pyrolua program cannot reach"
version = "0.1.0-dev"
authors = ["Soclets"]
maintainers = ["Soclets <tandz.we89@gmail.com>"]
maintainers-logins = ["Soclets"]
licenses = "Apache-2.0 WITH LLVM-exception"
executables = ["grapheme_test", "stack_test", "runtime_test"]
project-files = ["pyro_lua_unit.gpr"]

[[depends-on]]
pyro_lua = "*"

[[pins]]
pyro_lua = { path = "../.." }

# The library keeps the profile its proofs run on (development), whichever crate was built
# last: tests/run proves it with the configuration the last build left.
[build-profiles]
pyro_lua = "development"
